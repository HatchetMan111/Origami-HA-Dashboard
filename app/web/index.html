<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Origami – Setup</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 3h18v18H3V3zm0 18L21 3" stroke="currentColor" stroke-width="1.6" />
            <path d="M21 3v18H3L21 3z" fill="currentColor" opacity="0.9" />
          </svg>
        </div>
        <div>
          <h1>Origami für Home Assistant</h1>
          <p>Setup-Appliance · Design, Plugin, Dashboard in einem Lauf</p>
        </div>
        <div class="spacer"></div>
        <div id="status"></div>
      </header>

      <nav class="stepper" id="stepper" aria-label="Fortschritt"></nav>
      <main id="app" aria-live="polite"></main>

      <div class="footer">
        <a href="https://github.com/hazymorning/origami" target="_blank" rel="noreferrer">Origami</a> von hazymorning (AGPL-3.0) ·
        Setup-Appliance von Origami-LXC · läuft nur in deinem Netz
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
